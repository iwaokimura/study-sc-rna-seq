[project]
name = "study-sc-rna-seq"
version = "0.1.0"
description = "数学者向け scRNA-seq 解析入門ハンズオン（Scanpy / PBMC 3k）"
requires-python = ">=3.13"
dependencies = [
    "scanpy>=1.12.1",
    "anndata>=0.12.11",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "scipy>=1.17.1",
    "matplotlib>=3.10.8",
    "umap-learn>=0.5.12",
    "leidenalg>=0.11.0",
    "igraph>=1.0.0",
    "scvelo>=0.3.4",
    "jupyterlab>=4.5.6",
    "ipykernel>=7.2.0",
    "ipywidgets",          # tqdm の進捗表示（scVelo）を現状どおり保つ
    "nbconvert>=7.17.1",
]

[tool.uv]
package = false            # 配布用パッケージではない
